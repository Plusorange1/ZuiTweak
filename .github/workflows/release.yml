name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKM="$(ls "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          if [ -z "$SDKM" ]; then
            curl -sL -o /tmp/cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            mkdir -p "$SDK_ROOT/cmdline-tools"
            unzip -q /tmp/cmdline.zip -d "$SDK_ROOT/cmdline-tools"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest" 2>/dev/null || true
            SDKM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          yes | "$SDKM" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDKM" --sdk_root="$SDK_ROOT" "platforms;android-34" "build-tools;34.0.0"

      - name: Assemble debug
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename artifact
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/debug/app-debug.apk "ZuiTweak-${VERSION}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: ZuiTweak-*.apk
          generate_release_notes: true
          draft: false
